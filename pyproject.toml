[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "desk"
version = "0.2.0"
description = "Google Workspace CLI — Gmail, Drive, Sheets, Docs, Calendar"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Rob Cannon" }
]
dependencies = [
    "click>=8.3.2",
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.1",
    "google-auth-oauthlib>=1.0",
    "rich>=13.0",
    "markdown-it-py>=3.0",
    "keyring>=25.0",
    "openpyxl>=3.1",
    "python-docx>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "ruff>=0.1",
]

[project.scripts]
desk = "desk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/desk"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
