[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmail-cli"
version = "0.1.0"
description = "Command-line tool for managing Gmail"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Rob Cannon" }
]
dependencies = [
    "click>=8.0",
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.1",
    "google-auth-oauthlib>=1.0",
    "rich>=13.0",  # For nice terminal output
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
gm = "gm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gm"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
