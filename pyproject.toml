[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "desk"
version = "0.2.0"
description = "Google Workspace CLI — Gmail, Drive, Sheets, Docs, Calendar"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Rob Cannon" }
]
dependencies = [
    "click>=8.3.3",
    "google-api-python-client>=2.194.0",
    "google-auth-httplib2>=0.3.1",
    "google-auth-oauthlib>=1.0",
    "rich>=15.0.0",
    "markdown-it-py>=3.0",
    "keyring>=25.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.12",
]

[project.scripts]
desk = "desk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/desk"]

[tool.ruff]
src = ["src"]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# cli.py and commands/mail.py have intentionally long lines:
# tabular capability dicts and inline click-decorator help strings.
# Breaking them across lines hurts readability more than the limit helps.
"src/desk/cli.py" = ["E501"]
"src/desk/commands/mail.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
