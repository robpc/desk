name: Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      skip-dependency-review:
        required: false
        type: boolean
        default: false
        description: "Whether to skip dependency review"

      skip-codeql:
        required: false
        type: boolean
        default: false
        description: "Whether to skip CodeQL analysis"

permissions:
  pull-requests: write
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-review:
    # Dependency Review and CodeQL require GitHub Advanced Security on
    # private repos. Skip on private; they run normally once the repo is
    # public. Harmless on public repos (the condition is always true).
    if: ${{ (inputs.skip-dependency-review == false) && (github.event_name == 'pull_request') && (github.event.repository.private == false) }}
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          deny-licenses: AGPL-1.0-or-later, EUPL-1.0, EUPL-1.1, EUPL-1.2, OSL-1.0, OSL-1.1, OSL-2.0, OSL-2.1, OSL-3.0

  codeql:
    if: ${{ (inputs.skip-codeql == false) && (github.event.repository.private == false) }}
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:${{ matrix.language }}"
